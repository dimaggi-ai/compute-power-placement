name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r calc/requirements.txt
      - name: Move-vs-stay invariants
        run: cd calc && python3 test_move_vs_stay.py
      - name: Figures regenerate
        run: cd calc && python3 run.py
